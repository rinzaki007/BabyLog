name: BabyLog CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: babylog-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare persistent signing key when configured
        env:
          KEYSTORE_BASE64: ${{ secrets.BABYLOG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/babylog-release.jks"
            echo "BABYLOG_KEYSTORE_FILE=$RUNNER_TEMP/babylog-release.jks" >> "$GITHUB_ENV"
          else
            echo "Signing key not configured; using temporary debug signing for this CI run."
          fi
      - name: Run Android unit tests and build debug APK
        env:
          BABYLOG_KEYSTORE_PASSWORD: ${{ secrets.BABYLOG_KEYSTORE_PASSWORD }}
          BABYLOG_KEY_ALIAS: ${{ secrets.BABYLOG_KEY_ALIAS }}
          BABYLOG_KEY_PASSWORD: ${{ secrets.BABYLOG_KEY_PASSWORD }}
        run: |
          # Kotlin compilation needs a larger heap; serialize Gradle work to
          # avoid competing JVMs on the hosted runner. This is the last known
          # configuration that completed Kotlin compilation successfully.
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx10g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8/' gradle.properties
          sed -i 's/^org.gradle.parallel=.*/org.gradle.parallel=false/' gradle.properties
          {
            echo 'org.gradle.workers.max=1'
            echo 'kotlin.compiler.execution.strategy=in-process'
          } >> gradle.properties
          # Robolectric downloads android-all directly with HttpURLConnection, outside Gradle's
          # dependency transport. Use a Maven Central mirror and retry transient fetch failures.
          for attempt in 1 2 3 4; do
            log_file="$RUNNER_TEMP/android-build-${attempt}.log"
            set +e
            gradle --no-daemon --max-workers=1 testDebugUnitTest assembleDebug 2>&1 | tee "$log_file"
            gradle_status=${PIPESTATUS[0]}
            set -e

            if [ "$gradle_status" -eq 0 ]; then
              exit 0
            fi

            if [ "$attempt" -lt 4 ] &&
              grep -q "MavenArtifactFetcher.java" "$log_file" &&
              grep -q "HttpURLConnection.java" "$log_file"; then
              delay=$((attempt * 15))
              echo "Robolectric SDK download failed; retrying in ${delay}s (attempt $((attempt + 1))/4)."
              sleep "$delay"
              continue
            fi

            exit "$gradle_status"
          done
          exit 1
      - name: Verify launcher icon and themed artwork are packaged in the APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          BADGING="$("$AAPT" dump badging "$APK")"
          grep -E "^application:.*icon=" <<< "$BADGING"
          grep -Eq "^application-icon-[0-9]+:" <<< "$BADGING"
          RESOURCES="$("$AAPT" dump resources "$APK")"
          grep -q "mipmap/ic_launcher" <<< "$RESOURCES"
          grep -q "mipmap/ic_launcher_round" <<< "$RESOURCES"
          grep -q "drawable/theme_capybara_mascot" <<< "$RESOURCES"
          grep -q "drawable/theme_koala_mascot" <<< "$RESOURCES"
      - name: Upload Room schema snapshot
        uses: actions/upload-artifact@v4
        with:
          name: BabyLog-room-schema
          path: app/schemas/**/*.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: BabyLog-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
  sync-server:
    name: NAS Sync API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: PYTHONPATH=. pytest -q
  docker:
    name: NAS Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t babylog-sync:ci ./server
      - name: Smoke test NAS container
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/babylog-sync-data"
          docker run -d --name babylog-sync-ci \
            --read-only --tmpfs /tmp:size=32m,noexec,nosuid \
            --security-opt no-new-privileges --cap-drop ALL \
            --cap-add CHOWN --cap-add SETUID --cap-add SETGID \
            -e BABYLOG_JWT_SECRET=ci-only-secret-value-with-more-than-32-characters \
            -v "$RUNNER_TEMP/babylog-sync-data:/data" \
            -p 18766:18765 babylog-sync:ci
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18766/health; then
              docker rm -f babylog-sync-ci
              exit 0
            fi
            sleep 2
          done
          docker logs babylog-sync-ci
          docker rm -f babylog-sync-ci
          exit 1
      - name: Validate Compose configuration
        run: |
          BABYLOG_JWT_SECRET=ci-only-secret-value-with-more-than-32-characters \
          docker compose config --quiet
