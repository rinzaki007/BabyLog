name: BabyLog Android Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 2.2.0"
        required: true
        type: string
      publish:
        description: "Publish the GitHub Release and update manifest (leave off for build testing)"
        required: true
        default: false
        type: boolean
permissions:
  contents: write
jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.BABYLOG_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BABYLOG_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BABYLOG_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BABYLOG_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing BABYLOG_KEYSTORE_BASE64" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing BABYLOG_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing BABYLOG_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing BABYLOG_KEY_PASSWORD" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/babylog-release.jks"
          echo "BABYLOG_KEYSTORE_FILE=$RUNNER_TEMP/babylog-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        id: build_release
        env:
          BABYLOG_KEYSTORE_PASSWORD: ${{ secrets.BABYLOG_KEYSTORE_PASSWORD }}
          BABYLOG_KEY_ALIAS: ${{ secrets.BABYLOG_KEY_ALIAS }}
          BABYLOG_KEY_PASSWORD: ${{ secrets.BABYLOG_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then VERSION="${{ inputs.version }}"; fi
          VERSION_CODE=$((GITHUB_RUN_NUMBER + 1))
          echo "BABYLOG_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx10g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8/' gradle.properties
          sed -i 's/^org.gradle.parallel=.*/org.gradle.parallel=false/' gradle.properties
          {
            echo 'org.gradle.workers.max=1'
            echo 'kotlin.compiler.execution.strategy=in-process'
          } >> gradle.properties
          echo "Building signed APK: version=$VERSION versionCode=$VERSION_CODE"
          echo "Runner memory:"
          grep -E 'MemTotal|MemAvailable' /proc/meminfo || true
          echo "Runner disk:"
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          gradle --no-daemon --max-workers=1 --stacktrace assembleRelease -PappVersionName="$VERSION" -PappVersionCode="$VERSION_CODE"

      - name: Collect release build diagnostics
        if: failure() && steps.build_release.outcome == 'failure'
        shell: bash
        run: |
          echo "::group::Runner resources"
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP" || true
          df -i "$GITHUB_WORKSPACE" "$RUNNER_TEMP" || true
          grep -E 'MemTotal|MemAvailable|SwapTotal|SwapFree' /proc/meminfo || true
          echo "::endgroup::"
          echo "::group::Release outputs"
          find app/build/outputs -maxdepth 5 -type f -printf '%p (%s bytes)\n' 2>/dev/null | sort || true
          echo "::endgroup::"
          echo "::group::Gradle daemon logs"
          find "$HOME/.gradle/daemon" -type f -name '*.out.log' -print 2>/dev/null | tail -n 3 | while read -r log; do
            echo "--- $log (last 160 lines) ---"
            tail -n 160 "$log"
          done
          echo "::endgroup::"

      - name: Verify launcher icon is packaged in the release APK"
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING"
          printf '%s\n' "$BADGING" | grep -Eq "^application:.*icon="
          printf '%s\n' "$BADGING" | grep -Eq "^application-icon-[0-9]+:"
          "$AAPT" dump resources "$APK" | grep -q "mipmap/ic_launcher"
          "$AAPT" dump resources "$APK" | grep -q "mipmap/ic_launcher_round"
      - name: Publish GitHub Release
        if: github.event_name == 'push' || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
          name: BabyLog ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
      - name: Publish public update manifest
        if: github.event_name == 'push' || inputs.publish
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION_TAG="$GITHUB_REF_NAME"
          else
            VERSION_TAG="v${{ inputs.version }}"
          fi
          APK_PATH="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          APK_NAME="$(basename "$APK_PATH")"
          APK_SIZE="$(stat -c '%s' "$APK_PATH")"
          APK_SHA256="$(sha256sum "$APK_PATH" | awk '{print $1}')"
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/$VERSION_TAG/$APK_NAME"
          VERSION="${VERSION_TAG#v}"
          mkdir -p "$RUNNER_TEMP/babylog-update-feed"
          cat > "$RUNNER_TEMP/babylog-update-feed/latest.json" <<EOF
          {
            "tag": "$VERSION_TAG",
            "version": "$VERSION",
            "versionCode": $BABYLOG_VERSION_CODE,
            "notes": "BabyLog $VERSION_TAG 官方更新",
            "url": "$DOWNLOAD_URL",
            "size": $APK_SIZE,
            "sha256": "$APK_SHA256"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Restore the temporary Gradle memory overrides before switching branches.
          git restore --source=HEAD -- gradle.properties
          git switch --orphan update-feed
          git rm -rf . >/dev/null 2>&1 || true
          cp "$RUNNER_TEMP/babylog-update-feed/latest.json" latest.json
          git add latest.json
          git commit -m "chore: publish update manifest $VERSION_TAG"
          git push --force origin HEAD:updates
