name: BabyLog CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: babylog-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide whether database instrumentation tests are needed
        id: migration-scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_ACTION: ${{ github.event.action }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: execute the full database instrumentation suite."
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE="$PR_BASE_SHA"
            HEAD="$PR_HEAD_SHA"
            # The opened/reopened PR validates the complete change set. On later
            # synchronize events, validate the newest commit only: earlier commits
            # have already been checked, and UI-only follow-ups should not boot an emulator.
            if [[ "$PR_ACTION" == "synchronize" ]] && git rev-parse "$HEAD^" >/dev/null 2>&1; then
              BASE="$(git rev-parse "$HEAD^")"
              echo "PR synchronize event: checking database scope of the newest commit."
            fi
          else
            BASE="$PUSH_BEFORE_SHA"
            HEAD="$CURRENT_SHA"
          fi

          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "No usable base commit; run instrumentation tests conservatively."
            exit 0
          fi

          changed="$(git diff --name-only "$BASE...$HEAD")"
          echo "Changed files:"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '(^app/src/androidTest/|^app/src/main/java/.*/data/|(^|/)(BabyLogDatabase|BabyLogDao|.*Migration.*)\.kt$|^app/build\.gradle\.kts$|^gradle/libs\.versions\.toml$|^build\.gradle\.kts$)'; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "Database-related files changed; instrumentation tests are required."
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "No database-related files changed; emulator startup is skipped."
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare persistent signing key when configured
        env:
          KEYSTORE_BASE64: ${{ secrets.BABYLOG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/babylog-release.jks"
            echo "BABYLOG_KEYSTORE_FILE=$RUNNER_TEMP/babylog-release.jks" >> "$GITHUB_ENV"
          else
            echo "Signing key not configured; using temporary debug signing for this CI run."
          fi
      - name: Run Android unit tests and build debug APK
        env:
          BABYLOG_KEYSTORE_PASSWORD: ${{ secrets.BABYLOG_KEYSTORE_PASSWORD }}
          BABYLOG_KEY_ALIAS: ${{ secrets.BABYLOG_KEY_ALIAS }}
          BABYLOG_KEY_PASSWORD: ${{ secrets.BABYLOG_KEY_PASSWORD }}
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Verify launcher icon is packaged in the APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -E "^application:.*icon="
          printf '%s\n' "$BADGING" | grep -Eq "^application-icon-[0-9]+:"
          "$AAPT" dump resources "$APK" | grep -q "mipmap/ic_launcher"
          "$AAPT" dump resources "$APK" | grep -q "mipmap/ic_launcher_round"
      - name: Run Android database migration tests
        if: steps.migration-scope.outputs.required == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 3072 -cores 2
          disable-animations: true
          script: gradle --no-daemon --max-workers=2 connectedDebugAndroidTest --info
      - name: Explain skipped database instrumentation tests
        if: steps.migration-scope.outputs.required != 'true'
        run: echo "Skipped emulator-based database tests because this change does not touch database code, migrations, instrumentation tests, or Android build dependencies."
      - uses: actions/upload-artifact@v4
        with:
          name: BabyLog-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
  sync-server:
    name: NAS Sync API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: PYTHONPATH=. pytest -q
  docker:
    name: NAS Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t babylog-sync:ci ./server
      - name: Smoke test NAS container
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/babylog-sync-data"
          docker run -d --name babylog-sync-ci \
            --read-only --tmpfs /tmp:size=32m,noexec,nosuid \
            --security-opt no-new-privileges --cap-drop ALL \
            --cap-add CHOWN --cap-add SETUID --cap-add SETGID \
            -e BABYLOG_JWT_SECRET=ci-only-secret-value-with-more-than-32-characters \
            -v "$RUNNER_TEMP/babylog-sync-data:/data" \
            -p 18766:18765 babylog-sync:ci
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18766/health; then
              docker rm -f babylog-sync-ci
              exit 0
            fi
            sleep 2
          done
          docker logs babylog-sync-ci
          docker rm -f babylog-sync-ci
          exit 1
      - name: Validate Compose configuration
        run: |
          BABYLOG_JWT_SECRET=ci-only-secret-value-with-more-than-32-characters \
          docker compose config --quiet
