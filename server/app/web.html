<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>BabyLog · 家庭数据管理</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#282435;background:#f7f5fa}*{box-sizing:border-box}body{margin:0;min-height:100vh}button,input{font:inherit}button{cursor:pointer}.shell{max-width:1180px;margin:auto;padding:26px 22px 54px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px}.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:15px;background:#8064b4;color:white;display:grid;place-items:center;font-size:24px;box-shadow:0 7px 20px #8064b433}h1{font-size:21px;margin:0}.sub{color:#898394;font-size:13px;margin-top:3px}.userbar{display:flex;align-items:center;gap:12px;color:#746e7f;font-size:13px}.btn{border:0;border-radius:12px;padding:11px 16px;background:#8064b4;color:white;font-weight:650}.btn.ghost{background:transparent;color:#766c82;border:1px solid #e7e1ed}.login-wrap{min-height:78vh;display:grid;place-items:center}.login{width:min(420px,100%);background:#fff;border:1px solid #eee9f2;border-radius:24px;padding:32px;box-shadow:0 18px 60px #31234a0d}.login h2{margin:0 0 8px;font-size:23px}.login p{margin:0 0 24px;color:#898394;font-size:14px;line-height:1.6}.field{display:block;margin:14px 0}.field span{display:block;font-size:13px;color:#6f687a;margin-bottom:7px}.field input{width:100%;padding:13px 14px;border:1px solid #e5dfeb;border-radius:12px;outline:none;background:#fcfbfd}.field input:focus{border-color:#9279c0;box-shadow:0 0 0 3px #9279c01a}.error{color:#c34c60;font-size:13px;min-height:20px;margin:8px 0}.login .btn{width:100%;margin-top:4px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 22px}.tab{border:0;border-radius:11px;padding:10px 15px;background:#efedf2;color:#777080;font-size:14px}.tab.active{background:#8064b4;color:white}.welcome{background:linear-gradient(120deg,#8064b4,#a68acb);color:white;border-radius:22px;padding:24px 26px;margin-bottom:18px}.welcome h2{font-size:22px;margin:0 0 7px}.welcome p{margin:0;color:#f0eafb;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:18px}.stat,.panel{background:white;border:1px solid #eeeaf2;border-radius:18px;padding:19px}.stat .k{font-size:13px;color:#8a8493}.stat .v{font-size:30px;font-weight:750;margin-top:8px;color:#3d3549}.stat .hint{font-size:12px;color:#aaa4b0;margin-top:4px}.panel{margin-bottom:16px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.panel h3{font-size:16px;margin:0}.muted{color:#918b9b;font-size:13px}.baby-list,.record-list{display:grid;gap:10px}.baby,.record{display:flex;align-items:center;gap:13px;padding:12px;border-radius:13px;background:#faf9fb}.avatar{width:46px;height:46px;border-radius:15px;object-fit:cover;background:#eee8f5;display:grid;place-items:center;font-size:22px;flex:none}.baby strong,.record strong{display:block;font-size:14px}.baby small,.record small{display:block;color:#8d8795;margin-top:4px;font-size:12px}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.photo{border-radius:14px;overflow:hidden;background:#f1edf5}.photo img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}.photo div{padding:9px 10px;font-size:12px;color:#756d7e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:flex;gap:10px;flex-wrap:wrap}.note{background:#f7f4fa;border-radius:13px;padding:14px;color:#7c7487;font-size:13px;line-height:1.7}.empty{padding:28px 12px;text-align:center;color:#9a94a1;font-size:13px}@media(max-width:680px){.shell{padding:18px 14px 36px}.top{align-items:flex-start}.userbar span{display:none}.grid{gap:9px}.stat{padding:14px}.stat .v{font-size:25px}.tabs{gap:6px}.tab{padding:9px 12px;font-size:13px}.login{padding:25px 21px}}
</style></head><body><div id="app" class="shell"></div>
<script>
const app=document.getElementById('app');let data=null,active='overview';
const labels={FEEDING:'喂养',DIAPER:'日常护理',SLEEP:'睡眠',GROWTH:'成长'};
const fmt=t=>t?new Date(Number(t)).toLocaleString('zh-CN',{hour12:false}):'时间未记录';
const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};
async function api(url,opts={}){const r=await fetch(url,{credentials:'same-origin',...opts});if(r.status===401)throw Error('登录状态已过期，请重新登录');if(!r.ok){let m='请求失败';try{m=(await r.json()).detail||m}catch{}throw Error(m)}return r}
function loginView(message){app.innerHTML='<div class="login-wrap"><section class="login"><div class="brand" style="margin-bottom:22px"><div class="logo">🍼</div><div><h1>BabyLog</h1><div class="sub">家庭数据管理中心</div></div></div><h2>欢迎回来</h2><p>使用 BabyLog App 中注册的同一账号登录，查看已同步的家庭记录。</p><form id="loginForm"><label class="field"><span>账号 / 邮箱</span><input id="username" autocomplete="username" required placeholder="请输入账号或邮箱"></label><label class="field"><span>密码</span><input id="password" type="password" autocomplete="current-password" required placeholder="请输入密码"></label><div id="loginError" class="error"></div><button class="btn" type="submit">登录管理后台</button></form><div class="sub" style="margin-top:18px;text-align:center">仅显示已同步到 NAS 的数据</div></section></div>';document.getElementById('loginError').textContent=message||'';document.getElementById('loginForm').addEventListener('submit',doLogin)}
async function doLogin(e){e.preventDefault();const b=e.currentTarget.querySelector('button');b.disabled=true;b.textContent='正在登录…';try{const r=await fetch('/api/web/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value.trim(),password:document.getElementById('password').value})});if(!r.ok){let d={};try{d=await r.json()}catch{}throw Error(d.detail||'账号或密码错误')}await load()}catch(err){document.getElementById('loginError').textContent=err.message;b.disabled=false;b.textContent='登录管理后台'}}
function frame(){app.innerHTML='<header class="top"><div class="brand"><div class="logo">🍼</div><div><h1>BabyLog</h1><div class="sub">家庭数据管理中心</div></div></div><div class="userbar"><span id="account"></span><button class="btn ghost" id="logout">退出登录</button></div></header><nav class="tabs" id="tabs"></nav><main id="main"></main>';document.getElementById('account').textContent=data.user.username;document.getElementById('logout').onclick=logout;const nav=document.getElementById('tabs');[['overview','总览'],['babies','宝宝档案'],['records','成长记录'],['photos','相册'],['backup','数据备份']].forEach(x=>{const b=el('button','tab'+(active===x[0]?' active':''),x[1]);b.onclick=()=>{active=x[0];render()};nav.append(b)})}
function render(){frame();const root=document.getElementById('main');if(active==='overview')overview(root);if(active==='babies')babies(root);if(active==='records')records(root);if(active==='photos')photos(root);if(active==='backup')backup(root)}
function stat(label,value,hint){const c=el('section','stat');c.append(el('div','k',label),el('div','v',String(value)),el('div','hint',hint));return c}
function overview(root){const w=el('section','welcome');w.append(el('h2','',data.family.name||'我的家庭'),el('p','','你好，'+data.user.username+'。这里汇总了 NAS 已接收的数据。'));root.append(w);const g=el('div','grid');g.append(stat('宝宝档案',data.counts.babies,'已同步的宝宝资料'),stat('成长记录',data.counts.events,'喂养、护理、睡眠及成长'),stat('相册照片',data.counts.photos,'已上传至 NAS 的照片'));root.append(g);const p=el('section','panel'),head=el('div','panel-head');head.append(el('h3','','最近记录'),el('span','muted','最多显示 100 条'));p.append(head);const list=el('div','record-list');data.events.slice(0,8).forEach(e=>list.append(recordItem(e)));if(!data.events.length)list.append(el('div','empty','暂无同步记录'));p.append(list);root.append(p)}
function babies(root){const p=el('section','panel'),head=el('div','panel-head');head.append(el('h3','','宝宝档案'),el('span','muted',data.babies.length+' 位'));p.append(head);const list=el('div','baby-list');data.babies.forEach(b=>{const row=el('div','baby');if(b.avatar_url){const img=el('img','avatar');img.src=b.avatar_url;img.alt='宝宝头像';row.append(img)}else row.append(el('div','avatar','👶'));const info=el('div');info.append(el('strong','',b.payload.displayName||'未命名宝宝'),el('small','','出生时间：'+fmt(b.payload.birthTime)+' · '+(b.payload.sex||'性别未设置')));row.append(info);list.append(row)});if(!data.babies.length)list.append(el('div','empty','还没有宝宝档案同步到服务器'));p.append(list);root.append(p)}
function recordItem(e){const type=e.payload.eventType||'记录',d=e.details||{},row=el('div','record');row.append(el('div','avatar',type==='FEEDING'?'🍼':type==='DIAPER'?'🌿':type==='SLEEP'?'🌙':'📏'));let summary='';if(type==='FEEDING')summary=(d.amountMl||'—')+' ml 配方奶';else if(type==='DIAPER')summary=[d.urine?'小便':'',d.stool?'大便':''].filter(Boolean).join(' · ')||'护理记录';else if(type==='SLEEP')summary=(d.durationMinutes||'—')+' 分钟';else summary='成长测量';const info=el('div');info.append(el('strong','',labels[type]||type),el('small','',fmt(e.payload.occurredAt)+' · '+summary));row.append(info);return row}
function records(root){const p=el('section','panel'),head=el('div','panel-head');head.append(el('h3','','全部记录'),el('span','muted',data.events.length+' 条（最多 100 条）'));p.append(head);const list=el('div','record-list');data.events.forEach(e=>list.append(recordItem(e)));if(!data.events.length)list.append(el('div','empty','暂无记录'));p.append(list);root.append(p)}
function photos(root){const p=el('section','panel'),head=el('div','panel-head');head.append(el('h3','','家庭相册'),el('span','muted',data.photos.length+' 张（最多 120 张）'));p.append(head);const gallery=el('div','gallery');data.photos.forEach(ph=>{const card=el('article','photo'),img=el('img');img.loading='lazy';img.src=ph.photo_url;img.alt=ph.payload.caption||'家庭照片';card.append(img,el('div','',ph.payload.caption||fmt(ph.payload.takenAt)));gallery.append(card)});if(!data.photos.length)gallery.append(el('div','empty','暂无已上传照片'));p.append(gallery);root.append(p)}
function backup(root){const p=el('section','panel');p.append(el('h3','','数据导出与备份'),el('p','muted','导出当前家庭已同步的数据，包含宝宝档案、记录、照片及头像。文件为 ZIP 格式，可保存到电脑或其他安全位置。'));const n=el('div','note','导出内容只包含当前账号所属家庭的数据。请妥善保管备份文件，其中包含宝宝照片和个人记录。网页导入功能正在规划，导入时会先检查重复项和冲突，不会直接覆盖现有数据。');const actions=el('div','actions'),b=el('button','btn','下载完整备份');b.onclick=()=>{window.location.href='/api/web/export'};actions.append(b);p.append(n,actions);root.append(p)}
async function logout(){try{await fetch('/api/web/logout',{method:'POST',credentials:'same-origin'})}finally{data=null;active='overview';loginView('已退出登录')}}
async function load(){try{const r=await api('/api/web/overview');data=await r.json();render()}catch(e){data=null;loginView(e.message)}}
loginView('');fetch('/api/web/overview',{credentials:'same-origin'}).then(async r=>{if(r.ok){data=await r.json();render()}}).catch(()=>{});
</script></body></html>
