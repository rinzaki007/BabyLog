name: BabyLog CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: babylog-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BabyLog-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  sync-server:
    name: NAS Sync API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run API tests
        run: PYTHONPATH=. pytest -q

  docker:
    name: NAS Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build sync server image
        run: docker build -t babylog-sync:ci ./server
      - name: Smoke test NAS container
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/babylog-sync-data"
          docker run -d --name babylog-sync-ci \
            --read-only --tmpfs /tmp:size=32m,noexec,nosuid \
            --security-opt no-new-privileges --cap-drop ALL \
            --cap-add CHOWN --cap-add SETUID --cap-add SETGID \
            -e BABYLOG_JWT_SECRET=ci-only-secret-value-with-more-than-32-characters \
            -v "$RUNNER_TEMP/babylog-sync-data:/data" \
            -p 18766:18765 babylog-sync:ci
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18766/health; then
              docker rm -f babylog-sync-ci
              exit 0
            fi
            sleep 2
          done
          docker logs babylog-sync-ci
          docker rm -f babylog-sync-ci
          exit 1
      - name: Validate Compose configuration
        run: |
          BABYLOG_JWT_SECRET=ci-only-secret-value-with-more-than-32-characters \
          docker compose config --quiet
